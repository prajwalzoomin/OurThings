server.port=8080

# Active Spring Profile: use 'mysql' to connect to local MySQL (MySQL80), or leave empty for file-based H2
spring.profiles.active=mysql

# Persistent file-based H2 fallback (used when spring.profiles.active is not set to mysql)
spring.datasource.url=jdbc:h2:file:./data/ourthings_db;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console enabled at /h2-console for inspection
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Jackson formatting
spring.jackson.serialization.write-dates-as-timestamps=false

# File upload limits if needed
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Optional local config override (application-local.properties is ignored by git)
spring.config.import=optional:file:./server/src/main/resources/application-local.properties,optional:file:./application-local.properties

# ==============================================================================
# Google Gemini API Key
# Loaded securely via GEMINI_API_KEY env or application-local.properties
# ==============================================================================
gemini.api.key=${GEMINI_API_KEY:}


