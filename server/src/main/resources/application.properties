server.port=8080

# By default, use persistent file-based H2 in MySQL compatibility mode.
# This ensures zero friction on any development machine without needing a MySQL service pre-configured.
spring.datasource.url=jdbc:h2:file:./data/ourthings_db;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console enabled at /h2-console for inspection
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Jackson formatting
spring.jackson.serialization.write-dates-as-timestamps=false

# File upload limits if needed
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

